name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post your `WOL_AUTH_TOKEN`.** Redact MAC addresses and
        internal hostnames you don't want public: an issue is public.
  - type: input
    id: version
    attributes:
      label: Image tag or commit
      placeholder: "1.0.0 or sha-abc1234"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The `starting` line and the lines around the problem.
      render: json
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: |
        Docker host (Linux distribution, Unraid, ...), how the target is
        connected (same segment, VLAN), and the settings you changed. Leave
        out the token.
